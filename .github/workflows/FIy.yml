name: Build VirtualBackup APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          echo "Searching for Gradle build files..."
          find . -maxdepth 3 \
            \( -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle ]  [ -f build.gradle.kts ]  [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "ERROR: No Gradle build files found in the repository root."
            echo "Upload the complete Android project before building."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VirtualBackup-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
