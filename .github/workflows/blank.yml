name: Build VirtualBackup APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          echo "Repository files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'gradlew' \)

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle ]  [ -f build.gradle.kts ]  \
               [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "No Gradle project found in the repository root."
            echo "Upload the complete Android source project first."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VirtualBackup-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
